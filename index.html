<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <!-- header -->
    <header class="header">
        <h1>Rock Paper Scissors</h1>
    </header>
    <main class="game-layout">
         <!-- aside -->
      <aside class="sidebar">
            <!-- section1 History -->
            <section class="history box" >
                <h2>Game History</h2>
                <div class="history-list">
            
                </div>
            </section>
            <!-- Section 2 Statistics -->
            <section class="statistics box">
                <h2>Statistics</h2>
                <p>Wins:<span id="wins">0</span></p>
                <p>Losses:<span id="losses">0</span></p>
                <p>Draws:<span id="draws">0</span></p>
            </section>
      </aside>

      <section class="animation-area">
          <!-- Section1 Animation -->
           <section class="animation">
            <div class="player-choice">
              🪨
            </div>
            <div class="vs">
                VS
           </div>
           <div class="computer-choice">
              ❓
           </div>

           </section>
           <!-- Section2 Result -->
            <section class="result">
                <h2>Result</h2>
                <p class="result-message">Choose your move!</p>
            </section>
      </section>

      <section class="controls">
         <button type="button" class="btn btn-rock">
            <span class="btn-icon">🪨</span> 
            <span class="btn-label">Rock</span>
        </button>
         <button type="button" class="btn btn-paper">
            <span class="btn-icon">📄</span>
            <span class="btn-label">Paper</span>
            
        </button>
         <button type="button" class="btn btn-scissors">
            <span class="btn-icon">✂️</span> 
            <span class="btn-label">Scissors</span>
             </button>
         <button type="button" class="btn btn-reset">
            <span class="btn-icon">🔄</span> 
            <span class="btn-label">Reset</span>
             </button>
      </section>
    </main>
</body>
</html>
